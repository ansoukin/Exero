<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Exero - 基于 Tauri v2 + Rust 的 Windows 桌面自动化助手。快捷指令 + 可视化积木，20 种动作类型自由组合。" />
    <meta name="theme-color" content="#0078D4" />
    <title>Exero</title>
    <!-- Favicon：根据系统主题自动切换深浅版本 -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon-light.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon-dark.ico"
      media="(prefers-color-scheme: dark)"
    />
    <!-- 防止首帧白屏闪烁：body 透明让 Tauri transparent 窗口 + CSS 亚克力透出 -->
    <!-- 首帧防闪由 #boot-splash div 自带背景色负责，不需要 body 白底 -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      html, body { background: transparent; }
    </style>
    <script>
      (function () {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Boot 占位（B9 第三阶段 · 任务1：老横幅开屏已彻底移除）
           React 挂载前的极短窗口内只显示纯主题背景色（与 StartupSplash 的
           bg-background / SplashStage 动画背景连续），随后新开屏动画
           （SplashStage：logo 切出 + EXERO 字母展开）成为用户看到的第一帧。
           bootstrap() 完成后由前端添加 .leaving 类淡出（300ms）。 -->
      <div id="boot-splash" style="position:fixed;inset:0;background:#f9fbfd;z-index:9999;">
        <style>
          /* boot-splash 淡出动画（ready 信号触发后添加 .leaving 类） */
          #boot-splash.leaving {
            animation: boot-splash-leave 300ms ease-out forwards;
          }
          @keyframes boot-splash-leave {
            from { opacity: 1; }
            to { opacity: 0; }
          }
          @media (prefers-color-scheme: dark) {
            #boot-splash { background: #0b0f17; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
