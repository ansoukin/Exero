<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Plugin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0a0f1a;
      color: #e5e7eb;
      gap: 1.5rem;
      padding: 2rem;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin-top: -0.75rem;
      font-size: 0.875rem;
      color: #9ca3af;
      text-align: center;
    }
    button {
      padding: 0.875rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #0078D4;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button:hover { background: #106EBE; }
    button:active { background: #005a9e; transform: scale(0.98); }
    #result {
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.9rem;
      min-height: 3rem;
      min-width: 16rem;
      max-width: 90%;
      word-break: break-all;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .error { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .success { color: #34d399; border-color: rgba(52, 211, 153, 0.3); }
  </style>
</head>
<body>
  <h1>Hello Plugin</h1>
  <p class="subtitle">点击按钮调用 Rust .dll 的 say_hello 动作</p>
  <button id="callBtn">Call Rust</button>
  <div id="result">等待调用...</div>
  <script>
    // window.exero.invoke 由 Exero 主程序注入的桥接脚本提供
    // （见 src-tauri/src/lib.rs 的 PLUGIN_BRIDGE_SCRIPT）
    const btn = document.getElementById('callBtn');
    const resultEl = document.getElementById('result');

    btn.addEventListener('click', async () => {
      resultEl.classList.remove('error', 'success');
      resultEl.textContent = '调用中...';
      try {
        const result = await window.exero.invoke('say_hello', {});
        resultEl.classList.add('success');
        resultEl.textContent = JSON.stringify(result);
      } catch (e) {
        resultEl.classList.add('error');
        resultEl.textContent = '错误: ' + (e.message || e);
      }
    });
  </script>
</body>
</html>
